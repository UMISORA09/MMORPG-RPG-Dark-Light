<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#2a3342" stroke-width="1" stroke-opacity="0.3"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask">
      <circle cx="256" cy="256" r="256" fill="url(#vignette)"/>
    </mask>
  </defs>
  <rect width="512" height="512" fill="url(#grid)" mask="url(#gridMask)"/>
  <circle cx="256" cy="256" r="254" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>
</svg>

