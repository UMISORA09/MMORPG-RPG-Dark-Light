# ==============================================================================
# Nginx Configuration for Chiến Long Bá — 2.5D Action MMORPG Client
# High-performance SPA serving, Gzip compression, API Proxying & WebSockets
# ==============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression for 3D Shaders, Assets and Bundles
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;

    # Proxy REST API & WebSocket Realtime Gateway to api-server
    location /api/ {
        proxy_pass http://api-server:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
    }

    # Proxy 2D Pixel Chibi Sprite Pipeline assets
    location /assets/exported/ {
        proxy_pass http://api-server:3001/assets/exported/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy Interactive Game Sandbox
    location /game-sandbox/ {
        proxy_pass http://api-server:3001/game-sandbox/;
        proxy_set_header Host $host;
    }

    # Static Assets Caching (Vite hashed bundles, audio, textures)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|mp3|wav|ogg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
        try_files $uri =404;
    }

    # Single Page Application (SPA) routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

