openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: 2D Mobile MMORPG API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: classes
    description: Character class operations
  - name: characters
    description: Character operations
  - name: battle
    description: Battle operations
  - name: leaderboard
    description: Leaderboard operations
  - name: inventory
    description: Inventory, equipment, and item operations
  - name: community
    description: Forum and world chat operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Username already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login to an existing account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/server:
    post:
      operationId: selectServer
      tags: [auth]
      summary: Save the current account's region and server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServerSelectionInput"
      responses:
        "200":
          description: Selected server saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerSelection"
        "400":
          description: Server or region is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /classes:
    get:
      operationId: getClasses
      tags: [classes]
      summary: List all character classes
      responses:
        "200":
          description: List of classes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CharacterClass"

  /characters:
    get:
      operationId: getCharacters
      tags: [characters]
      summary: List current user's characters
      responses:
        "200":
          description: List of characters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Character"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createCharacter
      tags: [characters]
      summary: Create a new character
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CharacterInput"
      responses:
        "201":
          description: Character created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /characters/{characterId}:
    get:
      operationId: getCharacter
      tags: [characters]
      summary: Get a specific character
      parameters:
        - name: characterId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Character details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /characters/{characterId}/battle:
    post:
      operationId: startBattle
      tags: [battle]
      summary: Start a battle with a monster
      parameters:
        - name: characterId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BattleInput"
      responses:
        "200":
          description: Battle result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BattleResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Character not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /characters/{characterId}/battle-log:
    get:
      operationId: getBattleLog
      tags: [battle]
      summary: Get recent battle history for a character
      parameters:
        - name: characterId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Recent battles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BattleLog"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /items:
    get:
      operationId: getItems
      tags: [inventory]
      summary: List items available in the shop
      responses:
        "200":
          description: Shop item catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"

  /characters/{characterId}/inventory:
    get:
      operationId: getInventory
      tags: [inventory]
      summary: List items owned by a character
      parameters:
        - name: characterId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Character inventory
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryItem"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Character not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /characters/{characterId}/inventory/{itemId}/buy:
    post:
      operationId: buyItem
      tags: [inventory]
      summary: Buy an item from the shop
      parameters:
        - name: characterId
          in: path
          required: true
          schema:
            type: number
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Item purchased
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseResponse"
        "400":
          description: Not enough gold or item unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Character or item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /characters/{characterId}/inventory/{itemId}/equip:
    post:
      operationId: equipItem
      tags: [inventory]
      summary: Equip an owned item
      parameters:
        - name: characterId
          in: path
          required: true
          schema:
            type: number
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated character stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "400":
          description: Item cannot be equipped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Character or item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /characters/{characterId}/inventory/{itemId}/unequip:
    post:
      operationId: unequipItem
      tags: [inventory]
      summary: Unequip an owned item
      parameters:
        - name: characterId
          in: path
          required: true
          schema:
            type: number
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated character stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Character"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Character or item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /characters/{characterId}/inventory/{ownershipId}/enhance:
    post:
      operationId: enhanceItem
      tags: [inventory]
      summary: Enhance an owned equipment item
      parameters:
        - name: characterId
          in: path
          required: true
          schema:
            type: number
        - name: ownershipId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Enhanced item and updated character resources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnhanceInventoryResponse"
        "400":
          description: Item cannot be enhanced or resources are insufficient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Character or owned item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /characters/{characterId}/inventory/{ownershipId}/use:
    post:
      operationId: useItem
      tags: [inventory]
      summary: Use an owned consumable item
      parameters:
        - name: characterId
          in: path
          required: true
          schema:
            type: number
        - name: ownershipId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Applied item effect and remaining quantity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UseInventoryResponse"
        "400":
          description: Item cannot be used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Character or owned item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /community/posts:
    get:
      operationId: getCommunityPosts
      tags: [community]
      summary: List forum posts
      parameters:
        - name: serverId
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
            enum: [general, build, boss, notice]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Forum posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ForumPost"
    post:
      operationId: createCommunityPost
      tags: [community]
      summary: Create a forum post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateForumPostInput"
      responses:
        "201":
          description: Post created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumPost"
        "400":
          description: Invalid content or ownership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /community/posts/{postId}/like:
    post:
      operationId: setCommunityPostLike
      tags: [community]
      summary: Set the current user's like state on a post
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForumLikeInput"
      responses:
        "200":
          description: Like state updated
          content:
            application/json:
              schema:
                type: object
                required: [postId, liked, likesCount]
                properties:
                  postId: { type: number }
                  liked: { type: boolean }
                  likesCount: { type: number }
        "404":
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /community/posts/{postId}/comments:
    get:
      operationId: getCommunityPostComments
      tags: [community]
      summary: List comments on a post
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Post comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ForumComment"
        "404":
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createCommunityPostComment
      tags: [community]
      summary: Comment on a post
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForumCommentInput"
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumComment"
        "404":
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /community/chats:
    get:
      operationId: getWorldChats
      tags: [community]
      summary: List world, server, or party chat messages
      parameters:
        - name: serverId
          in: query
          schema:
            type: string
        - name: channel
          in: query
          schema:
            type: string
            enum: [world, server, party]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Chat messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorldChatMessage"
    post:
      operationId: createWorldChat
      tags: [community]
      summary: Send a world, server, or party chat message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorldChatInput"
      responses:
        "201":
          description: Chat message created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorldChatMessage"
        "400":
          description: Invalid message or ownership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /monsters:
    get:
      operationId: getMonsters
      tags: [battle]
      summary: List available monsters to fight
      responses:
        "200":
          description: List of monsters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Monster"

  /leaderboard:
    get:
      operationId: getLeaderboard
      tags: [leaderboard]
      summary: Get top players by level and experience
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success

    RegisterInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 20
        password:
          type: string
          minLength: 6

    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    User:
      type: object
      required: [id, username, createdAt]
      properties:
        id:
          type: number
        username:
          type: string
        createdAt:
          type: string
          format: date-time
        forumTitle:
          type: string
        selectedRegion:
          type: string
        selectedServerId:
          type: string

    ServerSelectionInput:
      type: object
      required: [serverId, region]
      properties:
        serverId:
          type: string
        region:
          type: string
          enum: [VN, SEA, TEST]

    ServerSelection:
      type: object
      required: [selectedRegion, selectedServerId]
      properties:
        selectedRegion:
          type: string
        selectedServerId:
          type: string

    AuthResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"

    CharacterClass:
      type: object
      required: [id, name, description, role, baseHp, baseAtk, baseDef, baseSpd, skills]
      properties:
        id:
          type: string
          description: "gunner | assassin | fighter | tank"
        name:
          type: string
        description:
          type: string
        role:
          type: string
        baseHp:
          type: number
        baseAtk:
          type: number
        baseDef:
          type: number
        baseSpd:
          type: number
        skills:
          type: array
          items:
            $ref: "#/components/schemas/Skill"
        color:
          type: string
        emoji:
          type: string

    Skill:
      type: object
      required: [name, description, damage, cooldown]
      properties:
        name:
          type: string
        description:
          type: string
        damage:
          type: number
        cooldown:
          type: number

    CharacterInput:
      type: object
      required: [name, classId]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 20
        classId:
          type: string

    Character:
      type: object
      required: [id, userId, name, classId, className, level, experience, hp, maxHp, atk, def, spd, gold, kills, deaths, createdAt]
      properties:
        id:
          type: number
        userId:
          type: number
        name:
          type: string
        classId:
          type: string
        className:
          type: string
        level:
          type: number
        experience:
          type: number
        experienceToNextLevel:
          type: number
        hp:
          type: number
        maxHp:
          type: number
        atk:
          type: number
        def:
          type: number
        spd:
          type: number
        gold:
          type: number
        kills:
          type: number
        deaths:
          type: number
        serverId:
          type: string
        title:
          type: string
        mp:
          type: number
        maxMp:
          type: number
        matk:
          type: number
        mdef:
          type: number
        combatPower:
          type: number
        createdAt:
          type: string
          format: date-time

    Item:
      type: object
      required: [id, name, category, type, equipSlot, description, lore, rarity, hpBoost, mpBoost, atkBoost, matkBoost, defBoost, mdefBoost, spdBoost, strBoost, dexBoost, intBoost, lukBoost, vitBoost, critRateBoost, healHpPercent, healMpPercent, price, maxStack, classId, requiredLevel, icon]
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
          enum: [equipment, consumable, material, quest]
        type:
          type: string
          enum: [weapon, armor, accessory, potion, scroll, food, stone, chest]
        equipSlot:
          type: string
          enum: [helm, armor, greaves, boots, pauldrons, gauntlets, main_weapon, off_weapon, earring, amulet, ring, relic, none]
        description:
          type: string
        lore:
          type: string
        rarity:
          type: string
        hpBoost:
          type: number
        mpBoost:
          type: number
        atkBoost:
          type: number
        matkBoost:
          type: number
        defBoost:
          type: number
        mdefBoost:
          type: number
        spdBoost:
          type: number
        strBoost:
          type: number
        dexBoost:
          type: number
        intBoost:
          type: number
        lukBoost:
          type: number
        vitBoost:
          type: number
        critRateBoost:
          type: number
        healHpPercent:
          type: number
        healMpPercent:
          type: number
        buffType:
          type: [string, "null"]
        price:
          type: number
        maxStack:
          type: number
        classId:
          type: ["string", "null"]
        requiredLevel:
          type: number
        icon:
          type: string

    EnhanceInventoryResponse:
      type: object
      required: [character, item]
      properties:
        character:
          type: object
          required: [id, gold, combatPower]
          properties:
            id: { type: number }
            gold: { type: number }
            combatPower: { type: number }
        item:
          type: object
          required: [ownershipId, itemId, enhanceLevel, bonusCombatPower]
          properties:
            ownershipId: { type: number }
            itemId: { type: string }
            enhanceLevel: { type: number }
            bonusCombatPower: { type: number }

    UseInventoryResponse:
      type: object
      required: [character, consumed]
      properties:
        character:
          type: object
          required: [id, hp, maxHp, mp, maxMp]
          properties:
            id: { type: number }
            hp: { type: number }
            maxHp: { type: number }
            mp: { type: number }
            maxMp: { type: number }
        consumed:
          type: object
          required: [ownershipId, itemId, quantityRemaining]
          properties:
            ownershipId: { type: number }
            itemId: { type: string }
            quantityRemaining: { type: number }

    InventoryItem:
      allOf:
        - $ref: "#/components/schemas/Item"
        - type: object
          required: [ownershipId, equipped, equippedSlot, slotIndex, quantity, enhanceLevel, bonusCombatPower, acquiredAt]
          properties:
