<svg fill="none" viewBox="0 0 960 320" width="100%" height="320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1e1136"/>
      <stop offset="60%" stop-color="#0a0518"/>
      <stop offset="100%" stop-color="#030108"/>
    </radialGradient>

    <!-- Neon Glow Gradient -->
    <linearGradient id="dragonFlame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3366">
        <animate attributeName="stop-color" values="#ff3366;#ff9900;#00f2ff;#ff3366" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#ffaa00">
        <animate attributeName="stop-color" values="#ffaa00;#7928ca;#ff0080;#ffaa00" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00f0ff">
        <animate attributeName="stop-color" values="#00f0ff;#00dfd8;#7928ca;#00f0ff" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Shimmer Highlight -->
    <linearGradient id="shimmer" x1="-100%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="x1" from="-100%" to="200%" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="0%" to="300%" dur="3s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Filter Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowHeavy" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="15" result="blur2" />
      <feComposite in="SourceGraphic" in2="blur2" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="960" height="320" rx="16" fill="url(#bgGrad)" stroke="#ff336644" stroke-width="2"/>

  <!-- Cyber Grid Lines -->
  <g opacity="0.15" stroke="#00f2ff" stroke-width="1">
    <line x1="0" y1="80" x2="960" y2="80"/>
    <line x1="0" y1="160" x2="960" y2="160"/>
    <line x1="0" y1="240" x2="960" y2="240"/>
    <line x1="160" y1="0" x2="160" y2="320"/>
    <line x1="320" y1="0" x2="320" y2="320"/>
    <line x1="480" y1="0" x2="480" y2="320"/>
    <line x1="640" y1="0" x2="640" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/>
  </g>

  <!-- Floating Magic Particles with CSS animation -->
  <circle cx="200" cy="90" r="3" fill="#00f2ff" opacity="0.8">
    <animate attributeName="cy" values="90;60;90" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="780" cy="110" r="4" fill="#ff3366" opacity="0.8">
    <animate attributeName="cy" values="110;80;110" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="480" cy="50" r="2.5" fill="#ffaa00" opacity="0.8">
    <animate attributeName="cy" values="50;35;50" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="220" r="3" fill="#ffaa00" opacity="0.6">
    <animate attributeName="cy" values="220;190;220" dur="4.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="850" cy="230" r="3.5" fill="#00f2ff" opacity="0.7">
    <animate attributeName="cy" values="230;200;230" dur="3.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Futuristic Corner Brackets -->
  <path d="M 24 60 L 24 24 L 60 24" stroke="url(#dragonFlame)" stroke-width="4" fill="none" filter="url(#glow)"/>
  <path d="M 936 60 L 936 24 L 900 24" stroke="url(#dragonFlame)" stroke-width="4" fill="none" filter="url(#glow)"/>
  <path d="M 24 260 L 24 296 L 60 296" stroke="url(#dragonFlame)" stroke-width="4" fill="none" filter="url(#glow)"/>
  <path d="M 936 260 L 936 296 L 900 296" stroke="url(#dragonFlame)" stroke-width="4" fill="none" filter="url(#glow)"/>

  <!-- Sub-Badge (Header Tag) -->
  <g transform="translate(480, 52)">
    <rect x="-170" y="-16" width="340" height="32" rx="16" fill="#13082b" stroke="url(#dragonFlame)" stroke-width="1.5" filter="url(#glow)"/>
    <text x="0" y="5" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#00f2ff" text-anchor="middle" letter-spacing="3">
      ⚡ NEXT-GEN 2.5D REAL-TIME MMORPG
    </text>
  </g>

  <!-- Main Title: CHIẾN LONG BÍ SỬ -->
  <g transform="translate(480, 138)">
    <!-- Shadow Glow Layer -->
    <text x="0" y="0" font-family="'Impact', 'Segoe UI Black', Arial, sans-serif" font-size="64" font-weight="900" fill="url(#dragonFlame)" text-anchor="middle" letter-spacing="6" filter="url(#glowHeavy)">
      CHIẾN LONG BÍ SỬ
    </text>
    <!-- Foreground Text -->
    <text x="0" y="0" font-family="'Impact', 'Segoe UI Black', Arial, sans-serif" font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="6">
      CHIẾN LONG BÍ SỬ
    </text>
    <!-- Gradient Overlay with Blend Mode -->
    <text x="0" y="0" font-family="'Impact', 'Segoe UI Black', Arial, sans-serif" font-size="64" font-weight="900" fill="url(#dragonFlame)" opacity="0.85" text-anchor="middle" letter-spacing="6">
      CHIẾN LONG BÍ SỬ
    </text>
  </g>

  <!-- English Subtitle -->
  <text x="480" y="185" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#ffb400" text-anchor="middle" letter-spacing="10" filter="url(#glow)">
    — REALM OF LEGENDS —
  </text>

  <!-- Tagline Features -->
  <text x="480" y="222" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#a598c9" text-anchor="middle" letter-spacing="1.5">
    ⚔️ 4 Legendary Classes &bull; 🌐 Real-Time 3D Village &amp; Arena &bull; 🐉 Boss Dungeon Raids &bull; ⚡ WebGL Engine
  </text>

  <!-- Branch Notice Pill in Banner -->
  <g transform="translate(480, 274)">
    <rect x="-240" y="-18" width="480" height="36" rx="18" fill="#ff005522" stroke="#ff3366" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </rect>
    <circle cx="-215" cy="0" r="5" fill="#00ff88">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="-195" y="5" font-family="'Consolas', 'Courier New', monospace" font-size="12" font-weight="700" fill="#ffffff">
      BRANCH NOTICE:
    </text>
    <text x="-70" y="5" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#00f2ff">
      Main = Showcase | Source Code = Nhánh <tspan fill="#ffb400" font-weight="800">master</tspan>
    </text>
  </g>
</svg>
