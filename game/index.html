<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chiến Long Bá</title>
  
  <!-- Master Compiled Sass Stylesheet -->
  <link rel="stylesheet" href="./src/styles/main.css">
  
  <!-- React 18 & Babel Standalone for Instant In-Browser Execution of TSX / JSX -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js" crossorigin></script>
</head>
<body>
  <!-- Master Application Mounting Point -->
  <div id="root"></div>

  <!-- In-Browser Standalone Transpiler & Vite Support -->
  <script type="text/babel" data-presets="react,typescript">
    const { useState, useRef, useEffect, useCallback, forwardRef, useImperativeHandle } = React;

    // ─── Procedural Web Audio Synthesizer (SoundSynth) ──────────────────────────
    class SoundSynthesizer {
      constructor() {
        this.ctx = null;
        this.isMuted = false;
      }

      initCtx() {
        if (!this.ctx && typeof window !== 'undefined') {
          const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
          if (AudioCtxClass) this.ctx = new AudioCtxClass();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      setMuted(muted) { this.isMuted = muted; }
      getMuted() { return this.isMuted; }

      playSlash() {
        if (this.isMuted) return;
        this.initCtx();
        if (!this.ctx) return;

        const bufferSize = this.ctx.sampleRate * 0.12;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const output = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;

        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.setValueAtTime(1200, this.ctx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(300, this.ctx.currentTime + 0.12);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start();
      }

      playAnimeSkill() {
        if (this.isMuted) return;
        this.initCtx();
        if (!this.ctx) return;

        const osc1 = this.ctx.createOscillator();
        const osc2 = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc1.type = 'sawtooth';
        osc1.frequency.setValueAtTime(600, this.ctx.currentTime);
        osc1.frequency.exponentialRampToValueAtTime(1400, this.ctx.currentTime + 0.18);

        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(300, this.ctx.currentTime);
        osc2.frequency.exponentialRampToValueAtTime(900, this.ctx.currentTime + 0.18);

        gain.gain.setValueAtTime(0.28, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.22);

        osc1.connect(gain); osc2.connect(gain);
        gain.connect(this.ctx.destination);

        osc1.start(); osc2.start();
        osc1.stop(this.ctx.currentTime + 0.22);
        osc2.stop(this.ctx.currentTime + 0.22);
      }

      playFlameWave() {
        if (this.isMuted) return;
        this.initCtx();
        if (!this.ctx) return;

        const osc = this.ctx.createOscillator();
        const filter = this.ctx.createBiquadFilter();
        const gain = this.ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(190, this.ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(70, this.ctx.currentTime + 0.35);

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(450, this.ctx.currentTime);

        gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.35);

        osc.connect(filter); filter.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start();
        osc.stop(this.ctx.currentTime + 0.35);
      }

      playHit(isCrit = false) {
        if (this.isMuted) return;
        this.initCtx();
        if (!this.ctx) return;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = isCrit ? 'square' : 'triangle';
        osc.frequency.setValueAtTime(isCrit ? 220 : 140, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + (isCrit ? 0.2 : 0.12));

        gain.gain.setValueAtTime(isCrit ? 0.45 : 0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + (isCrit ? 0.2 : 0.12));

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start();
        osc.stop(this.ctx.currentTime + (isCrit ? 0.2 : 0.12));
      }

      playDodge() {
        if (this.isMuted) return;
        this.initCtx();
        if (!this.ctx) return;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.18);

        gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.18);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start();
        osc.stop(this.ctx.currentTime + 0.18);
      }

      playStagger() {
        if (this.isMuted) return;
        this.initCtx();
        if (!this.ctx) return;

        [800, 1200, 1600].forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.04);
          osc.frequency.exponentialRampToValueAtTime(200, this.ctx.currentTime + idx * 0.04 + 0.25);

          gain.gain.setValueAtTime(0.2, this.ctx.currentTime + idx * 0.04);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + idx * 0.04 + 0.25);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(this.ctx.currentTime + idx * 0.04);
          osc.stop(this.ctx.currentTime + idx * 0.04 + 0.25);
        });
      }
    }

    const soundSynth = new SoundSynthesizer();

    // ─── JSX Component: GameHUD ────────────────────────────────────────────────
    function GameHUD({ knight, slime, currentAnimText }) {
      const kPct = Math.max(0, (knight.hp / knight.maxHp) * 100);
      const kLagPct = Math.max(0, (knight.lagHp / knight.maxHp) * 100);
      const kEnergyPct = Math.max(0, (knight.energy / knight.maxEnergy) * 100);

      const sPct = Math.max(0, (slime.hp / slime.maxHp) * 100);
      const sLagPct = Math.max(0, (slime.lagHp / slime.maxHp) * 100);
      const sPoisePct = Math.max(0, (slime.poise / slime.maxPoise) * 100);

      return (
        <div className="hud-header">
          <div className="hud-card">
            <div className="card-title player-title">
              <span>⚔️ CHIBI KNIGHT</span>
              <span style={{ fontSize: '10px', color: '#94a3b8' }}>(Lv.1)</span>
            </div>
            <div className="hp-bar-container">
              <div className="hp-bar-lag" style={{ width: `${kLagPct}%` }} />
              <div className="hp-bar-fill" style={{ width: `${kPct}%` }} />
            </div>
            <div className="energy-bar-container">
              <div className="energy-fill" style={{ width: `${kEnergyPct}%` }} />
            </div>
            <div className="stat-subtext">
              <span>{currentAnimText}</span>
              <span>{Math.round(knight.hp)} / {knight.maxHp} HP</span>
            </div>
          </div>

          <div className="hud-card" style={{ textAlign: 'right' }}>
            <div className="card-title boss-title" style={{ justifyContent: 'flex-end' }}>
              <span>👹 ONI SLIME BOSS</span>
              <span style={{ fontSize: '10px', color: '#fca5a5' }}>(Lv.5)</span>
            </div>
            <div className="hp-bar-container">
              <div className="hp-bar-lag" style={{ width: `${sLagPct}%` }} />
              <div className="hp-bar-fill boss-fill" style={{ width: `${sPct}%` }} />
            </div>
            <div className="poise-bar-container">
              <div className="poise-fill" style={{ width: `${sPoisePct}%` }} />
            </div>
            <div className="stat-subtext" style={{ justifyContent: 'flex-end', gap: '10px' }}>
              <span className={`ai-badge state-${slime.aiState}`}>
                {slime.isStaggered ? 'STAGGERED!' : slime.aiState}
              </span>
              <span>{Math.round(slime.hp)} / {slime.maxHp} HP</span>
            </div>
          </div>
        </div>
      );
    }

    // ─── JSX Component: ActionCombatBar ────────────────────────────────────────
    function ActionCombatBar({
      onAttack,
      onAnimeSkill,
      onFlameWave,
      onDodge,
      onToggleDebug,
      onToggleLighting,
      onToggleSound,
      onRespawn,
      cooldowns,
      debugMode,
      dynamicLighting,
      isMuted
    }) {
      return (
        <div className="controls-overlay">
          <button className="btn" onClick={onAttack}>
            ⚔️ [J] Chém Đại Kiếm
          </button>
          <button className="btn btn-anime" onClick={onAnimeSkill}>
            ✨ [K] Anime Skill VFX {cooldowns.skillK > 0 && `(${cooldowns.skillK.toFixed(1)}s)`}
          </button>
          <button className="btn btn-flame" onClick={onFlameWave}>
            🔥 [L] Kiếm Khí Long Bá {cooldowns.skillL > 0 && `(${cooldowns.skillL.toFixed(1)}s)`}
          </button>
          <button className="btn btn-secondary" onClick={onDodge}>
            💨 [Space] Lướt Né {cooldowns.dodgeSpace > 0 && `(${cooldowns.dodgeSpace.toFixed(1)}s)`}
          </button>
          <button className="btn btn-secondary" onClick={onToggleDebug}>
            🛠️ [F1] Debug <span className={`debug-badge ${debugMode ? 'badge-on' : 'badge-off'}`}>{debugMode ? 'BẬT' : 'TẮT'}</span>
          </button>
          <button className="btn btn-secondary" onClick={onToggleLighting}>
            💡 Ánh Sáng <span className={`debug-badge ${dynamicLighting ? 'badge-on' : 'badge-off'}`}>{dynamicLighting ? 'BẬT' : 'TẮT'}</span>
          </button>
          <button className="btn btn-secondary" onClick={onToggleSound}>
            {isMuted ? '🔇 Tắt Tiếng' : '🔊 Âm Thanh'}
          </button>
          <button className="btn btn-secondary" onClick={onRespawn}>
            🔄 [R] Hồi Sinh
          </button>
        </div>
      );
    }

    // ─── JSX Component: VirtualJoystick ────────────────────────────────────────
    function VirtualJoystick({
      onMoveLeft,
      onMoveRight,
      onStopMove,
      onAttack,
      onAnimeSkill,
      onFlameWave,
      onDodge,
      cooldowns
    }) {
      const stickRef = useRef(null);
      const zoneRef = useRef(null);

      useEffect(() => {
        const zone = zoneRef.current;
        const stick = stickRef.current;
        if (!zone || !stick) return;

        let touchActive = false;
        let startX = 0;

        const handleTouchStart = (e) => {
          touchActive = true;
          startX = e.touches[0].clientX;
        };

        const handleTouchMove = (e) => {
          if (!touchActive) return;
          const currentX = e.touches[0].clientX;
          const diffX = currentX - startX;
          const clampedX = Math.max(-35, Math.min(35, diffX));
          stick.style.transform = `translate(calc(-50% + ${clampedX}px), -50%)`;

          if (clampedX < -10) onMoveLeft();
          else if (clampedX > 10) onMoveRight();
          else onStopMove();
        };

        const handleTouchEnd = () => {
          touchActive = false;
          stick.style.transform = 'translate(-50%, -50%)';
          onStopMove();
        };

        zone.addEventListener('touchstart', handleTouchStart, { passive: false });
        window.addEventListener('touchmove', handleTouchMove, { passive: false });
        window.addEventListener('touchend', handleTouchEnd);
        window.addEventListener('touchcancel', handleTouchEnd);

        return () => {
          zone.removeEventListener('touchstart', handleTouchStart);
          window.removeEventListener('touchmove', handleTouchMove);
          window.removeEventListener('touchend', handleTouchEnd);
          window.removeEventListener('touchcancel', handleTouchEnd);
        };
      }, [onMoveLeft, onMoveRight, onStopMove]);

      return (
        <div className="touch-controls">
          <div className="touch-joystick-zone" ref={zoneRef}>
            <div className="touch-stick" ref={stickRef} />
          </div>

          <div className="touch-actions">
            <div
              className="touch-btn btn-k"
              onTouchStart={(e) => { e.preventDefault(); onAnimeSkill(); }}
            >
              ✨
              {cooldowns.skillK > 0 && <span className="cd-overlay">{cooldowns.skillK.toFixed(0)}</span>}
            </div>
            <div
              className="touch-btn btn-l"
              onTouchStart={(e) => { e.preventDefault(); onFlameWave(); }}
            >
              🔥
              {cooldowns.skillL > 0 && <span className="cd-overlay">{cooldowns.skillL.toFixed(0)}</span>}
            </div>
            <div
              className="touch-btn btn-j"
              onTouchStart={(e) => { e.preventDefault(); onAttack(); }}
            >
              ⚔️
            </div>
            <div
              className="touch-btn btn-space"
              onTouchStart={(e) => { e.preventDefault(); onDodge(); }}
            >
              💨
              {cooldowns.dodgeSpace > 0 && <span className="cd-overlay">{cooldowns.dodgeSpace.toFixed(0)}</span>}
            </div>
          </div>
        </div>
      );
    }

    // ─── JSX Component: ComboBanner ────────────────────────────────────────────
    function ComboBanner({ comboCount, comboTimer, comboMultiplier }) {
      if (comboCount <= 1) return null;

      let rank = 'C';
      let rankClass = 'rank-c';
      if (comboCount >= 15) { rank = 'SSS'; rankClass = 'rank-sss'; }
      else if (comboCount >= 10) { rank = 'S'; rankClass = 'rank-s'; }
      else if (comboCount >= 6) { rank = 'A'; rankClass = 'rank-a'; }
      else if (comboCount >= 3) { rank = 'B'; rankClass = 'rank-b'; }

      const timerPct = Math.max(0, Math.min(100, (comboTimer / 3.0) * 100));

      return (
        <div className="combo-banner combo-active">
          <div className="combo-digits">
            {comboCount}<span>HITS</span>
          </div>
          <div className={`combo-rank ${rankClass}`}>
            RANK {rank} ({comboMultiplier.toFixed(1)}x DMG)
          </div>
          <div className="combo-timer-bar">
            <div className="timer-fill" style={{ width: `${timerPct}%` }} />
          </div>
        </div>
      );
    }

    // ─── JSX Component: CombatLog ──────────────────────────────────────────────
    function CombatLog({ events }) {
      if (!events || events.length === 0) return null;
      return (
        <div className="combat-log-container">
          {events.slice(-4).map((ev) => (
            <div key={ev.id} className={`log-line log-${ev.type}`}>
              <span className="log-time">[{ev.time}]</span>
              <span>{ev.text}</span>
            </div>
          ))}
        </div>
      );
    }

    // ─── TSX Component: GameCanvas ─────────────────────────────────────────────
    const CANVAS_WIDTH = 640;
    const CANVAS_HEIGHT = 360;
    const WORLD_WIDTH = 1280;
    const GROUND_Y = 270;
    const PIXEL_SCALE = 3;

    const GameCanvas = forwardRef(function GameCanvas(
      {
        knightState,
        slimeState,
        onKnightUpdate,
        onSlimeUpdate,
        onCombatEvent,
        onComboHit,
        comboMultiplier,
        debugMode,
        dynamicLighting
      },
      ref
    ) {
      const canvasRef = useRef(null);

      const knightRef = useRef({ ...knightState });
      const slimeRef = useRef({ ...slimeState });
      const cameraXRef = useRef(0);
      const screenShakeRef = useRef(0);

      const activeProjectilesRef = useRef([]);
      const activeVFXRef = useRef([]);
      const damageTextsRef = useRef([]);
      const moveKeysRef = useRef({ left: false, right: false });

      const atlasImageRef = useRef(new Image());
      const atlasLoadedRef = useRef(false);
      const mappingDataRef = useRef(null);

      const torchesRef = useRef([
        { x: 120, y: 150, baseRadius: 85 },
        { x: 380, y: 150, baseRadius: 85 },
        { x: 640, y: 150, baseRadius: 85 },
        { x: 900, y: 150, baseRadius: 85 },
        { x: 1160, y: 150, baseRadius: 85 },
      ]);

      useEffect(() => {
        let isMounted = true;
        async function loadAssets() {
          const candidates = [
            '/assets/exported/mapping.json',
            '../assets/exported/mapping.json',
            'assets/exported/mapping.json'
          ];
          for (const path of candidates) {
            try {
              const res = await fetch(path);
              if (res.ok) {
                const data = await res.json();
                if (!isMounted) return;
                mappingDataRef.current = data;
                const imgPath = path.replace('mapping.json', 'atlas.png');
                atlasImageRef.current.src = imgPath;
                atlasImageRef.current.onload = () => {
                  if (isMounted) atlasLoadedRef.current = true;
                };
                return;
              }
            } catch (e) {}
          }
        }
        loadAssets();
        return () => { isMounted = false; };
      }, []);

      useImperativeHandle(ref, () => ({
        triggerAttack() {
          const k = knightRef.current;
          if (k.isAttacking || k.dodgeTimer > 0) return;
          k.isAttacking = true;
          k.currentAnim = 'knight_attack';
          k.frameIndex = 0;
          k.animTimer = 0;
          k.vfxSpawnedThisAttack = false;
          soundSynth.playSlash();
        },

        triggerAnimeSkill() {
          const k = knightRef.current;
          if (k.isAttacking || k.dodgeTimer > 0) return;
          k.isAttacking = true;
          k.currentAnim = 'knight_attack';
          k.frameIndex = 0;
          k.animTimer = 0;
          k.vfxSpawnedThisAttack = false;

          soundSynth.playAnimeSkill();
          screenShakeRef.current = 9;

          setTimeout(() => {
            spawnAnimeVFX(k.x + 40 * k.facing, GROUND_Y - 30, k.facing);
          }, 70);

          setTimeout(() => {
            spawnAnimeVFX(k.x + 85 * k.facing, GROUND_Y - 45, k.facing);
            checkHitboxCollision(k.facing * 1.5, 36, true);
            onCombatEvent({ text: 'Anime Slash đánh trúng liên hoàn!', type: 'skill' });
          }, 150);
        },

        triggerFlameWave() {
          const k = knightRef.current;
          if (k.isAttacking || k.dodgeTimer > 0) return;
          k.isAttacking = true;
          k.currentAnim = 'knight_attack';
          k.frameIndex = 0;
          k.animTimer = 0;
          k.vfxSpawnedThisAttack = false;

          soundSynth.playFlameWave();
          screenShakeRef.current = 5;

          setTimeout(() => {
            activeProjectilesRef.current.push({
              x: k.x + k.facing * 25,
              y: GROUND_Y - 35,
              vx: k.facing * 450,
              vy: 0,
              facing: k.facing,
              distanceTraveled: 0,
              maxDistance: 650,
              damage: 42,
              radius: 22,
              life: 1.6,
              particles: []
            });
            onCombatEvent({ text: 'Khai hỏa Kiếm Khí Long Bá!', type: 'skill' });
          }, 90);
        },

        triggerDodge() {
          const k = knightRef.current;
          if (k.dodgeTimer > 0 || k.isAttacking) return;
          k.dodgeTimer = 0.35;
          k.isInvincible = true;
          k.invincibleTimer = 0.35;
          k.vx_force = k.facing * 340;
          soundSynth.playDodge();
          spawnDamageText(k.x, k.y - 45, 'DODGE!', false, '#38bdf8');
          onCombatEvent({ text: 'Hiệp sĩ kích hoạt lướt né bất tử!', type: 'dodge' });
        },

        respawnSlime() {
          const s = slimeRef.current;
          s.x = s.spawnX;
          s.hp = s.maxHp;
          s.lagHp = s.maxHp;
          s.isDead = false;
          s.aiState = 'patrol';
          s.currentAnim = 'slime_idle';
          s.frameIndex = 0;
          s.animTimer = 0;
          s.isWindingUp = false;
          s.poise = s.maxPoise;
          s.isStaggered = false;
          onCombatEvent({ text: 'Oni Slime Boss đã hồi sinh tại sào huyệt!', type: 'boss_rage' });
        },

        setMoveInput(left, right) {
          moveKeysRef.current = { left, right };
        }
      }));

      function spawnAnimeVFX(x, y, facing = 1) {
        activeVFXRef.current.push({
          x, y, facing,
          anim: 'slash_anime_01',
          frameIndex: 0,
          animTimer: 0,
          fps: 18,
          totalFrames: 6,
        });
      }

      function spawnDamageText(x, y, text, isCrit = false, customColor = null) {
        damageTextsRef.current.push({
          x: x + (Math.random() * 20 - 10),
          y: y - 20,
          text: isCrit ? `-${text} CRIT!` : (typeof text === 'number' ? `-${text}` : text),
          color: customColor || (isCrit ? '#facc15' : '#f43f5e'),
          fontSize: isCrit ? 18 : 13,
          alpha: 1.0,
          vy: -50,
        });
      }

      function applyDamageToSlime(direction, forceMultiplier, bonusDmg, isCritForced) {
        const s = slimeRef.current;
        if (s.isDead) return;

        screenShakeRef.current = 7 * forceMultiplier;
        const isCrit = isCritForced || Math.random() > 0.45;
        const baseDmg = isCrit ? 40 : 22;
        const scaledDmg = Math.floor((baseDmg + bonusDmg) * comboMultiplier + Math.random() * 10);

        s.hp = Math.max(0, s.hp - scaledDmg);
        s.vx_force = direction * 240 * forceMultiplier;
        s.currentAnim = s.hp <= 0 ? 'slime_die' : 'slime_hit';
        s.frameIndex = 0;
        s.animTimer = 0;

        s.poise -= 25 * forceMultiplier;
        if (s.poise <= 0 && !s.isStaggered) {
          s.poise = 0;
          s.isStaggered = true;
          s.staggerTimer = 2.5;
          s.aiState = 'stagger';
          soundSynth.playStagger();
          screenShakeRef.current = 12;
          spawnDamageText(s.x, s.y - 70, 'STAGGER BREAK!', true, '#8b5cf6');
          onCombatEvent({ text: 'BOSS BỊ VỠ ĐỠ! CHOÁNG STAGGER!', type: 'stagger' });
        }

        soundSynth.playHit(isCrit);
        spawnDamageText(s.x, s.y - 50, scaledDmg, isCrit);
        onComboHit();

        if (s.hp <= 0) {
          s.hp = 0;
          s.isDead = true;
          s.aiState = 'die';
          spawnDamageText(s.x, s.y - 80, '+150 EXP & 60 GOLD', true, '#facc15');
          onCombatEvent({ text: 'Tiêu diệt Oni Slime Boss thành công!', type: 'exp' });
        } else {
          onCombatEvent({
            text: `Đánh trúng Boss: -${scaledDmg} HP ${isCrit ? '(CHÍ MẠNG!)' : ''}`,
            type: isCrit ? 'crit' : 'damage'
          });
        }
      }

      function checkHitboxCollision(forceMultiplier = 1.0, bonusDmg = 0, isCritForced = false) {
        const k = knightRef.current;
        const s = slimeRef.current;
        if (s.isDead) return;

        const hbW = 46 * PIXEL_SCALE;
        const hbH = 36 * PIXEL_SCALE;
        const hbX = k.facing === 1 ? k.x + 8 : k.x - hbW - 8;
        const hbY = k.y - hbH - 6;

        const sbW = 40 * PIXEL_SCALE;
        const sbH = 38 * PIXEL_SCALE;
        const sbX = s.x - sbW / 2;
        const sbY = s.y - sbH;

        const isOverlap = !(
          hbX + hbW < sbX ||
          hbX > sbX + sbW ||
          hbY + hbH < sbY ||
          hbY > sbY + sbH
        );

        if (isOverlap) {
          applyDamageToSlime(k.facing, forceMultiplier, bonusDmg, isCritForced);
        }
      }

      useEffect(() => {
        let animFrameId;
        let lastTime = performance.now();
        let syncTimer = 0;

        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;
        ctx.imageSmoothingEnabled = false;

        function gameLoop(now) {
          const dt = Math.min((now - lastTime) / 1000, 0.05);
          lastTime = now;

          const k = knightRef.current;
          const s = slimeRef.current;

          if (screenShakeRef.current > 0) {
            screenShakeRef.current = Math.max(0, screenShakeRef.current - dt * 22);
          }

          const targetCamX = k.x - CANVAS_WIDTH / 2;
          cameraXRef.current += (targetCamX - cameraXRef.current) * 0.08;
          cameraXRef.current = Math.max(0, Math.min(WORLD_WIDTH - CANVAS_WIDTH, cameraXRef.current));

          if (k.invincibleTimer > 0) {
            k.invincibleTimer -= dt;
            if (k.invincibleTimer <= 0) k.isInvincible = false;
          }
          if (k.dodgeTimer > 0) k.dodgeTimer -= dt;
          if (k.energy < k.maxEnergy) k.energy = Math.min(k.maxEnergy, k.energy + dt * 15);

          if (!k.isAttacking && k.dodgeTimer <= 0) {
            let moving = false;
            if (moveKeysRef.current.left) {
              k.x -= k.speed * dt;
              k.facing = -1;
              moving = true;
            } else if (moveKeysRef.current.right) {
              k.x += k.speed * dt;
              k.facing = 1;
              moving = true;
            }
            k.currentAnim = moving ? 'knight_run' : 'knight_idle';
          }

          k.x += k.vx_force * dt;
          k.vx_force *= Math.max(0, 1 - 9 * dt);
          k.x = Math.max(40, Math.min(WORLD_WIDTH - 40, k.x));

          s.x += s.vx_force * dt;
          s.vx_force *= Math.max(0, 1 - 9 * dt);

          k.lagHp += (k.hp - k.lagHp) * 0.08;
          s.lagHp += (s.hp - s.lagHp) * 0.08;

          if (!s.isDead) {
            if (s.isStaggered) {
              s.staggerTimer -= dt;
              if (s.staggerTimer <= 0) {
                s.isStaggered = false;
                s.poise = s.maxPoise;
                s.aiState = 'patrol';
              }
            } else {
              if (s.attackCooldownTimer > 0) s.attackCooldownTimer -= dt;

              const dx = k.x - s.x;
              const dy = k.y - s.y;
              const dist = Math.sqrt(dx * dx + dy * dy);

              if (dist <= s.visionRadius && k.hp > 0) {
                if (s.aiState === 'patrol') {
                  s.aiState = 'alert';
                  spawnDamageText(s.x, s.y - 65, '!', false, '#ef4444');
                }

                if (dist <= s.attackRadius) {
                  s.aiState = 'attack';
                  s.facing = dx > 0 ? 1 : -1;
                  if (s.attackCooldownTimer <= 0 && !s.isWindingUp) {
                    s.isWindingUp = true;
                    s.windupTimer = 0.35;
                  }
                } else {
                  s.aiState = 'chase';
                  s.facing = dx > 0 ? 1 : -1;
                  s.x += s.facing * s.speedChase * dt;
                }
              } else {
                s.aiState = 'patrol';
                s.patrolTimer -= dt;
                if (s.patrolTimer <= 0) {
                  s.patrolTimer = 2.0 + Math.random() * 2.0;
                  s.patrolDirection = s.patrolDirection * -1;
                }
                s.facing = s.patrolDirection;
                s.x += s.facing * s.speedPatrol * dt;
              }

              if (s.isWindingUp) {
                s.windupTimer -= dt;
                if (s.windupTimer <= 0) {
                  s.isWindingUp = false;
                  s.attackCooldownTimer = s.attackCooldown;
                  s.vx_force = s.facing * 190;
                  screenShakeRef.current = 6;
                  const distToK = Math.abs(k.x - s.x);
                  if (distToK < 65 && !k.isInvincible) {
                    const dmg = Math.floor(15 + Math.random() * 8);
                    k.hp = Math.max(0, k.hp - dmg);
                    k.vx_force = s.facing * 230;
                    k.isInvincible = true;
                    k.invincibleTimer = 0.35;
                    soundSynth.playHit(false);
                    spawnDamageText(k.x, k.y - 45, dmg, false, '#ef4444');
                    onCombatEvent({ text: `Boss tấn công hiệp sĩ: -${dmg} HP`, type: 'boss_rage' });
                  }
                }
              }
            }
          }

          updateAnimation(k, dt, () => {
            k.isAttacking = false;
            k.currentAnim = 'knight_idle';
          }, (frameIdx) => {
            if (frameIdx === 2 && !k.vfxSpawnedThisAttack) {
              k.vfxSpawnedThisAttack = true;
              spawnAnimeVFX(k.x + 28 * k.facing, k.y - 24, k.facing);
              checkHitboxCollision();
            }
          });

          updateAnimation(s, dt, () => {
            if (s.currentAnim === 'slime_hit') s.currentAnim = s.isDead ? 'slime_die' : 'slime_idle';
          });

          for (let i = activeProjectilesRef.current.length - 1; i >= 0; i--) {
            const p = activeProjectilesRef.current[i];
            p.x += p.vx * dt;
            p.distanceTraveled += Math.abs(p.vx * dt);
            p.life -= dt;

            p.particles.push({
              x: p.x - p.facing * 14,
              y: p.y + (Math.random() * 8 - 4),
              size: Math.random() * 5 + 2,
              alpha: 1.0,
            });

            for (let j = p.particles.length - 1; j >= 0; j--) {
              const pt = p.particles[j];
              pt.alpha -= dt * 4;
              if (pt.alpha <= 0) p.particles.splice(j, 1);
            }

            if (!s.isDead && Math.abs(p.x - s.x) < 45 && Math.abs(p.y - (s.y - 25)) < 40) {
              spawnAnimeVFX(p.x, p.y, p.facing);
              applyDamageToSlime(p.facing, 1.4, p.damage, true);
              activeProjectilesRef.current.splice(i, 1);
              continue;
            }

            if (p.distanceTraveled >= p.maxDistance || p.life <= 0 || p.x < 0 || p.x > WORLD_WIDTH) {
              activeProjectilesRef.current.splice(i, 1);
            }
          }

          for (let i = activeVFXRef.current.length - 1; i >= 0; i--) {
            const vfx = activeVFXRef.current[i];
            vfx.animTimer += dt;
            if (vfx.animTimer >= 1.0 / vfx.fps) {
              vfx.animTimer -= 1.0 / vfx.fps;
              vfx.frameIndex++;
              if (vfx.frameIndex >= vfx.totalFrames) activeVFXRef.current.splice(i, 1);
            }
          }

          for (let i = damageTextsRef.current.length - 1; i >= 0; i--) {
            const dtObj = damageTextsRef.current[i];
            dtObj.y += dtObj.vy * dt;
            dtObj.alpha -= dt * 1.35;
            if (dtObj.alpha <= 0) damageTextsRef.current.splice(i, 1);
          }

          renderCanvas(ctx, now / 1000);

          syncTimer += dt;
          if (syncTimer >= 0.065) {
            syncTimer = 0;
            onKnightUpdate(() => ({ ...k }));
            onSlimeUpdate(() => ({ ...s }));
          }

          animFrameId = requestAnimationFrame(gameLoop);
        }

        animFrameId = requestAnimationFrame(gameLoop);
        return () => cancelAnimationFrame(animFrameId);
      }, [comboMultiplier, debugMode, dynamicLighting, onCombatEvent, onComboHit, onKnightUpdate, onSlimeUpdate]);

      function updateAnimation(entity, dt, onEnd, onFrame) {
        const mapping = mappingDataRef.current;
        if (!mapping || !mapping.animations[entity.currentAnim]) return;

        const animDef = mapping.animations[entity.currentAnim];
        const frameDur = 1.0 / (animDef.fps || 10);
        entity.animTimer += dt;

        if (entity.animTimer >= frameDur) {
          entity.animTimer -= frameDur;
          entity.frameIndex++;
          onFrame?.(entity.frameIndex);

          if (entity.frameIndex >= animDef.frames.length) {
            if (animDef.loop) entity.frameIndex = 0;
            else onEnd?.();
          }
        }
      }

      function renderCanvas(ctx, time) {
        const camX = cameraXRef.current;
        const k = knightRef.current;
        const s = slimeRef.current;

        ctx.save();

        if (screenShakeRef.current > 0) {
          const sx = (Math.random() - 0.5) * screenShakeRef.current;
          const sy = (Math.random() - 0.5) * screenShakeRef.current;
          ctx.translate(sx, sy);
        }

        renderWorldBackground(ctx, camX);

        ctx.save();
        ctx.translate(-camX, 0);

        torchesRef.current.forEach((t) => {
          ctx.fillStyle = '#64748b';
          ctx.fillRect(t.x - 4, t.y, 8, 20);
          const flameOffset = Math.sin(time * 9 + t.x) * 3;
          ctx.fillStyle = '#f97316';
          ctx.beginPath();
          ctx.arc(t.x, t.y - 4 + flameOffset, 7, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#fef08a';
          ctx.beginPath();
          ctx.arc(t.x, t.y - 6 + flameOffset, 4, 0, Math.PI * 2);
          ctx.fill();
        });

        if (atlasLoadedRef.current && mappingDataRef.current) {
          if (!k.isInvincible || Math.floor(time * 20) % 2 === 0) {
            renderSpriteEntity(ctx, k, k.currentAnim, k.frameIndex);
          }
          renderSpriteEntity(ctx, s, s.currentAnim, s.frameIndex);

          activeProjectilesRef.current.forEach((p) => {
            p.particles.forEach((pt) => {
              ctx.fillStyle = `rgba(251, 146, 60, ${pt.alpha})`;
              ctx.beginPath();
              ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
              ctx.fill();
            });

            ctx.save();
            ctx.translate(p.x, p.y);
            if (p.facing === -1) ctx.scale(-1, 1);
            ctx.shadowColor = '#f59e0b';
            ctx.shadowBlur = 12;
            ctx.fillStyle = '#fef08a';
            ctx.beginPath();
            ctx.arc(0, 0, 18, -Math.PI * 0.4, Math.PI * 0.4);
            ctx.arc(-8, 0, 14, Math.PI * 0.35, -Math.PI * 0.35, true);
            ctx.fill();
            ctx.restore();
          });

          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          activeVFXRef.current.forEach((vfx) => renderVFXEntity(ctx, vfx));
          ctx.restore();

          renderOverheadLifeBar(ctx, s, '[Lv.5] Oni Slime', s.hp, s.lagHp, s.maxHp, '#f43f5e');
        }

        damageTextsRef.current.forEach((d) => {
          ctx.save();
          ctx.globalAlpha = Math.max(0, d.alpha);
          ctx.fillStyle = d.color;
          ctx.font = `bold ${d.fontSize}px 'Courier New', monospace`;
          ctx.shadowColor = '#000';
          ctx.shadowBlur = 4;
          ctx.fillText(d.text, d.x, d.y);
          ctx.restore();
        });

        if (debugMode) renderDebugVisualizer(ctx);

        ctx.restore();

        if (dynamicLighting) renderDynamicLighting(ctx, camX, time);

        ctx.restore();
      }

      function renderWorldBackground(ctx, camX) {
        const skyGrad = ctx.createLinearGradient(0, 0, 0, CANVAS_HEIGHT);
        skyGrad.addColorStop(0, '#06030c');
        skyGrad.addColorStop(0.65, '#160d26');
        skyGrad.addColorStop(1, '#0e071c');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

        const moonX = 500 - camX * 0.15;
        ctx.fillStyle = '#fef08a';
        ctx.beginPath();
        ctx.arc(moonX, 70, 26, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(254, 240, 138, 0.15)';
        ctx.beginPath();
        ctx.arc(moonX, 70, 45, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#140c21';
        for (let i = 0; i < 14; i++) {
          const px = i * 100 + 20 - camX;
          if (px > -60 && px < CANVAS_WIDTH + 60) {
            ctx.fillRect(px, 115, 24, GROUND_Y - 115);
            ctx.fillRect(px - 4, 110, 32, 8);
          }
        }

        ctx.fillStyle = '#241a38';
        ctx.fillRect(0, GROUND_Y, CANVAS_WIDTH, CANVAS_HEIGHT - GROUND_Y);
        ctx.fillStyle = '#4a3466';
        ctx.fillRect(0, GROUND_Y, CANVAS_WIDTH, 4);

        ctx.fillStyle = '#1a1229';
        for (let y = GROUND_Y + 12; y < CANVAS_HEIGHT; y += 18) {
          for (let wx = -40; wx < WORLD_WIDTH + 40; wx += 40) {
            const sx = wx - (camX % 40) - 20;
            ctx.fillRect(sx, y, 36, 11);
          }
        }
      }

      function renderDynamicLighting(ctx, camX, time) {
        const k = knightRef.current;
        const lightCanvas = document.createElement('canvas');
        lightCanvas.width = CANVAS_WIDTH;
        lightCanvas.height = CANVAS_HEIGHT;
        const lctx = lightCanvas.getContext('2d');
        if (!lctx) return;

        lctx.fillStyle = 'rgba(7, 4, 15, 0.72)';
        lctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
        lctx.globalCompositeOperation = 'destination-out';

        const kScreenX = k.x - camX;
        const kScreenY = k.y - 35;
        const kGrad = lctx.createRadialGradient(kScreenX, kScreenY, 15, kScreenX, kScreenY, 115);
        kGrad.addColorStop(0, 'rgba(0, 0, 0, 1.0)');
        kGrad.addColorStop(0.65, 'rgba(0, 0, 0, 0.65)');
        kGrad.addColorStop(1, 'rgba(0, 0, 0, 0.0)');
        lctx.fillStyle = kGrad;
        lctx.beginPath();
        lctx.arc(kScreenX, kScreenY, 115, 0, Math.PI * 2);
        lctx.fill();

        torchesRef.current.forEach((t) => {
          const tScreenX = t.x - camX;
          if (tScreenX > -80 && tScreenX < CANVAS_WIDTH + 80) {
            const radius = t.baseRadius + Math.sin(time * 8 + t.x) * 4;
            const tGrad = lctx.createRadialGradient(tScreenX, t.y, 10, tScreenX, t.y, radius);
            tGrad.addColorStop(0, 'rgba(0, 0, 0, 1.0)');
            tGrad.addColorStop(0.7, 'rgba(0, 0, 0, 0.55)');
            tGrad.addColorStop(1, 'rgba(0, 0, 0, 0.0)');
            lctx.fillStyle = tGrad;
            lctx.beginPath();
            lctx.arc(tScreenX, t.y, radius, 0, Math.PI * 2);
            lctx.fill();
          }
        });

        activeProjectilesRef.current.forEach((p) => {
          const pScreenX = p.x - camX;
          const pGrad = lctx.createRadialGradient(pScreenX, p.y, 8, pScreenX, p.y, 65);
          pGrad.addColorStop(0, 'rgba(0, 0, 0, 0.95)');
          pGrad.addColorStop(1, 'rgba(0, 0, 0, 0.0)');
          lctx.fillStyle = pGrad;
          lctx.beginPath();
          lctx.arc(pScreenX, p.y, 65, 0, Math.PI * 2);
          lctx.fill();
        });

        ctx.drawImage(lightCanvas, 0, 0);
      }

      function renderOverheadLifeBar(ctx, entity, title, hp, lagHp, maxHp, color) {
        if (entity.isDead) return;

        const barW = 60;
        const barH = 5;
        const barX = entity.x - barW / 2;
        const barY = entity.y - 65;

        ctx.fillStyle = 'rgba(15, 10, 25, 0.85)';
        ctx.fillRect(barX - 2, barY - 14, barW + 4, barH + 16);
        ctx.strokeStyle = '#4c1d95';
        ctx.lineWidth = 1;
        ctx.strokeRect(barX - 2, barY - 14, barW + 4, barH + 16);

        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 9px sans-serif';
        ctx.fillText(title, barX, barY - 4);

        ctx.fillStyle = '#231d33';
        ctx.fillRect(barX, barY, barW, barH);

        ctx.fillStyle = '#facc15';
        ctx.fillRect(barX, barY, barW * Math.max(0, Math.min(1, lagHp / maxHp)), barH);

        ctx.fillStyle = color;
        ctx.fillRect(barX, barY, barW * Math.max(0, Math.min(1, hp / maxHp)), barH);
      }

      function renderSpriteEntity(ctx, entity, animName, frameIdx) {
        const mapping = mappingDataRef.current;
        if (!mapping) return;
        const animDef = mapping.animations[animName];
        if (!animDef) return;

        const frameKey = animDef.frames[frameIdx % animDef.frames.length];
        const frameData = mapping.frames[frameKey];
        if (!frameData) return;

        const f = frameData.frame;
        const pivot = frameData.pivot;

        const drawW = f.w * PIXEL_SCALE;
        const drawH = f.h * PIXEL_SCALE;

        ctx.save();
        ctx.translate(entity.x, entity.y);
        if (entity.facing === -1) ctx.scale(-1, 1);

        const dx = -drawW * pivot.x;
        const dy = -drawH * pivot.y;

        ctx.drawImage(atlasImageRef.current, f.x, f.y, f.w, f.h, dx, dy, drawW, drawH);
        ctx.restore();
      }

      function renderVFXEntity(ctx, vfx) {
        const mapping = mappingDataRef.current;
        if (!mapping) return;
        const animDef = mapping.animations[vfx.anim];
        if (!animDef) return;

        const frameKey = animDef.frames[vfx.frameIndex % animDef.frames.length];
        const frameData = mapping.frames[frameKey];
        if (!frameData) return;

        const f = frameData.frame;
        const pivot = frameData.pivot;

        const drawW = f.w * PIXEL_SCALE;
        const drawH = f.h * PIXEL_SCALE;

        ctx.save();
        ctx.translate(vfx.x, vfx.y);
        if (vfx.facing === -1) ctx.scale(-1, 1);

        const dx = -drawW * pivot.x;
        const dy = -drawH * pivot.y;

        ctx.drawImage(atlasImageRef.current, f.x, f.y, f.w, f.h, dx, dy, drawW, drawH);
        ctx.restore();
      }

      function renderDebugVisualizer(ctx) {
        const k = knightRef.current;
        const s = slimeRef.current;

        ctx.strokeStyle = s.aiState === 'patrol' ? 'rgba(34, 197, 94, 0.45)' : 'rgba(239, 68, 68, 0.65)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([5, 5]);
        ctx.beginPath();
        ctx.arc(s.x, s.y - 25, s.visionRadius, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(234, 179, 8, 0.65)';
        ctx.beginPath();
        ctx.arc(s.x, s.y - 25, s.attackRadius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = s.aiState === 'patrol' ? '#22c55e' : '#ef4444';
        ctx.font = '10px monospace';
        ctx.fillText(`Bonfire Vision [${s.visionRadius}px] - ${s.aiState}`, s.x - 70, s.y - s.visionRadius - 6);

        if (k.currentAnim === 'knight_attack' && k.frameIndex === 2) {
          const hbW = 46 * PIXEL_SCALE;
          const hbH = 36 * PIXEL_SCALE;
          const hbX = k.facing === 1 ? k.x + 8 : k.x - hbW - 8;
          const hbY = k.y - hbH - 6;

          ctx.strokeStyle = '#ef4444';
          ctx.lineWidth = 2;
          ctx.strokeRect(hbX, hbY, hbW, hbH);
          ctx.fillStyle = 'rgba(239, 68, 68, 0.25)';
          ctx.fillRect(hbX, hbY, hbW, hbH);
        }
      }

      return (
        <div className="game-viewport">
          <canvas ref={canvasRef} width={CANVAS_WIDTH} height={CANVAS_HEIGHT} />
        </div>
      );
    });

    // ─── Master Application TSX Root: App ──────────────────────────────────────
    function App() {
      const canvasRef = useRef(null);

      const [knight, setKnight] = useState({
        x: 200,
        y: 270,
        facing: 1,
        currentAnim: 'knight_idle',
        frameIndex: 0,
        animTimer: 0,
        isAttacking: false,
        speed: 135,
        vx_force: 0,
        maxHp: 100,
        hp: 100,
        lagHp: 100,
        isInvincible: false,
        invincibleTimer: 0,
        dodgeTimer: 0,
        energy: 100,
        maxEnergy: 100,
        vfxSpawnedThisAttack: false,
      });

      const [slime, setSlime] = useState({
        x: 750,
        spawnX: 750,
        y: 270,
        facing: -1,
        currentAnim: 'slime_idle',
        frameIndex: 0,
        animTimer: 0,
        maxHp: 150,
        hp: 150,
        lagHp: 150,
        isDead: false,
        vx_force: 0,
        speedPatrol: 45,
        speedChase: 100,
        aiState: 'patrol',
        visionRadius: 280,
        attackRadius: 65,
        attackCooldown: 1.6,
        attackCooldownTimer: 0,
        patrolTimer: 2.0,
        patrolDirection: -1,
        isWindingUp: false,
        windupTimer: 0,
        poise: 100,
        maxPoise: 100,
        isStaggered: false,
        staggerTimer: 0,
      });

      const [combatEvents, setCombatEvents] = useState([
        { id: '1', time: '00:01', text: 'Đấu trường Chiến Long Bá đã khởi động!', type: 'skill' }
      ]);

      const [gameStats, setGameStats] = useState({
        comboCount: 0,
        comboTimer: 0,
        comboMultiplier: 1.0,
        totalDamage: 0,
        kills: 0,
      });

      const [cooldowns, setCooldowns] = useState({
        skillK: 0,
        skillL: 0,
        dodgeSpace: 0,
      });

      const [debugMode, setDebugMode] = useState(true);
      const [dynamicLighting, setDynamicLighting] = useState(true);
      const [isMuted, setIsMuted] = useState(false);

      const addCombatEvent = useCallback((event) => {
        const d = new Date();
        const time = `${d.getMinutes().toString().padStart(2, '0')}:${d.getSeconds().toString().padStart(2, '0')}`;
        setCombatEvents((prev) => [...prev.slice(-12), { ...event, id: Math.random().toString(), time }]);
      }, []);

      const handleComboHit = useCallback(() => {
        setGameStats((prev) => {
          const nextCount = prev.comboCount + 1;
          const nextMult = 1.0 + Math.min(1.5, Math.floor(nextCount / 3) * 0.15);
          return {
            ...prev,
            comboCount: nextCount,
            comboTimer: 2.8,
            comboMultiplier: nextMult,
          };
        });
      }, []);

      const handleAttack = useCallback(() => {
        canvasRef.current?.triggerAttack();
      }, []);

      const handleAnimeSkill = useCallback(() => {
        if (cooldowns.skillK > 0) return;
        canvasRef.current?.triggerAnimeSkill();
        setCooldowns((prev) => ({ ...prev, skillK: 2.2 }));
      }, [cooldowns.skillK]);

      const handleFlameWave = useCallback(() => {
        if (cooldowns.skillL > 0) return;
        canvasRef.current?.triggerFlameWave();
        setCooldowns((prev) => ({ ...prev, skillL: 3.0 }));
      }, [cooldowns.skillL]);

      const handleDodge = useCallback(() => {
        if (cooldowns.dodgeSpace > 0) return;
        canvasRef.current?.triggerDodge();
        setCooldowns((prev) => ({ ...prev, dodgeSpace: 1.5 }));
      }, [cooldowns.dodgeSpace]);

      const handleRespawn = useCallback(() => {
        canvasRef.current?.respawnSlime();
      }, []);

      useEffect(() => {
        const handleKeyDown = (e) => {
          const k = e.key.toLowerCase();
          if (k === 'a' || e.key === 'ArrowLeft') canvasRef.current?.setMoveInput(true, false);
          if (k === 'd' || e.key === 'ArrowRight') canvasRef.current?.setMoveInput(false, true);

          if (k === 'j') { e.preventDefault(); handleAttack(); }
          if (k === 'k') { e.preventDefault(); handleAnimeSkill(); }
          if (k === 'l') { e.preventDefault(); handleFlameWave(); }
          if (e.code === 'Space') { e.preventDefault(); handleDodge(); }
          if (k === 'r') { e.preventDefault(); handleRespawn(); }
          if (e.key === 'F1') { e.preventDefault(); setDebugMode((prev) => !prev); }
        };

        const handleKeyUp = (e) => {
          const k = e.key.toLowerCase();
          if (k === 'a' || e.key === 'ArrowLeft' || k === 'd' || e.key === 'ArrowRight') {
            canvasRef.current?.setMoveInput(false, false);
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        window.addEventListener('keyup', handleKeyUp);
        return () => {
          window.removeEventListener('keydown', handleKeyDown);
          window.removeEventListener('keyup', handleKeyUp);
        };
      }, [handleAttack, handleAnimeSkill, handleFlameWave, handleDodge, handleRespawn]);

      useEffect(() => {
        const timer = setInterval(() => {
          setCooldowns((prev) => ({
            skillK: Math.max(0, prev.skillK - 0.1),
            skillL: Math.max(0, prev.skillL - 0.1),
            dodgeSpace: Math.max(0, prev.dodgeSpace - 0.1),
          }));

          setGameStats((prev) => {
            if (prev.comboTimer > 0) {
              const nextTimer = prev.comboTimer - 0.1;
              if (nextTimer <= 0) {
                return { ...prev, comboTimer: 0, comboCount: 0, comboMultiplier: 1.0 };
              }
              return { ...prev, comboTimer: nextTimer };
            }
            return prev;
          });
        }, 100);

        return () => clearInterval(timer);
      }, []);

      return (
        <React.Fragment>
          <div className="game-viewport">
            <GameHUD
              knight={knight}
              slime={slime}
              currentAnimText={`${knight.currentAnim} [${knight.frameIndex}]`}
            />

            <GameCanvas
              ref={canvasRef}
              knightState={knight}
              slimeState={slime}
              onKnightUpdate={setKnight}
              onSlimeUpdate={setSlime}
              onCombatEvent={addCombatEvent}
              onComboHit={handleComboHit}
              comboMultiplier={gameStats.comboMultiplier}
              debugMode={debugMode}
              dynamicLighting={dynamicLighting}
            />

            <ComboBanner
              comboCount={gameStats.comboCount}
              comboTimer={gameStats.comboTimer}
              comboMultiplier={gameStats.comboMultiplier}
            />

            <CombatLog events={combatEvents} />

            <VirtualJoystick
              onMoveLeft={() => canvasRef.current?.setMoveInput(true, false)}
              onMoveRight={() => canvasRef.current?.setMoveInput(false, true)}
              onStopMove={() => canvasRef.current?.setMoveInput(false, false)}
              onAttack={handleAttack}
              onAnimeSkill={handleAnimeSkill}
              onFlameWave={handleFlameWave}
              onDodge={handleDodge}
              cooldowns={cooldowns}
            />
          </div>

          <ActionCombatBar
            onAttack={handleAttack}
            onAnimeSkill={handleAnimeSkill}
            onFlameWave={handleFlameWave}
            onDodge={handleDodge}
            onToggleDebug={() => setDebugMode((prev) => !prev)}
            onToggleLighting={() => setDynamicLighting((prev) => !prev)}
            onToggleSound={() => {
              setIsMuted((prev) => {
                soundSynth.setMuted(!prev);
                return !prev;
              });
            }}
            onRespawn={handleRespawn}
            cooldowns={cooldowns}
            debugMode={debugMode}
            dynamicLighting={dynamicLighting}
            isMuted={isMuted}
          />

          <div className="keyboard-hint">
            Phím: <kbd>A</kbd>/<kbd>D</kbd> Chạy · <kbd>Space</kbd> Lướt né · <kbd>J</kbd> Chém thường · <kbd>K</kbd> Skill Anime · <kbd>L</kbd> Kiếm khí đạn đạo · <kbd>F1</kbd> Debug Bonfire · <kbd>R</kbd> Reset
          </div>
        </React.Fragment>
      );
    }

    // Mount to DOM
    const rootContainer = document.getElementById('root');
    if (rootContainer) {
      const root = ReactDOM.createRoot ? ReactDOM.createRoot(rootContainer) : null;
      if (root) {
        root.render(<App />);
      } else {
        ReactDOM.render(<App />, rootContainer);
      }
    }
  </script>
</body>
</html>
