# ==============================================================================
# Chiến Long Bá (Realm of Legends) — Full-Stack 2.5D Action MMORPG
# Production-Ready Monorepo Docker Compose Orchestration
# ==============================================================================

services:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. PostgreSQL 16 Database
  # ────────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: clb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-game_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-game_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-game_mmorpg}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-game_user} -d ${POSTGRES_DB:-game_mmorpg}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  # ────────────────────────────────────────────────────────────────────────────
  # 2. Game API Server & WebSocket Realtime Gateway
  # ────────────────────────────────────────────────────────────────────────────
  api-server:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: clb-api-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-game_user}:${POSTGRES_PASSWORD:-game_password_2026}@postgres:5432/${POSTGRES_DB:-game_mmorpg}
      PGHOST: postgres
      PGPORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-game_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-game_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-game_mmorpg}
      SESSION_SECRET: ${SESSION_SECRET:-clb_mmorpg_session_secret_jwt_2026}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3001/api/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    ports:
      - "${API_PORT:-3001}:3001"

  # ────────────────────────────────────────────────────────────────────────────
  # 3. Game Web Client (Three.js 2.5D Canvas & Dark Fantasy HUD via Nginx)
  # ────────────────────────────────────────────────────────────────────────────
  mmorpg-game:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: clb-game-client
    restart: unless-stopped
    depends_on:
      api-server:
        condition: service_healthy
    ports:
      - "${CLIENT_PORT:-8080}:80"

volumes:
  postgres_data:
    name: clb_postgres_data
